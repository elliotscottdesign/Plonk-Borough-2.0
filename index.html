<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Always revalidate the shell so a new deploy's hashed bundle is picked up
         straight away — staff/founder shouldn't have to hard-refresh to see changes. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>No Dice — London Fields · OPEN 28/5</title>
    <meta name="description" content="No Dice — 407 Mentmore Terrace, Hackney, E8 3PH. Opening 28/5. Sign up for the opening details." />
    <meta property="og:title" content="No Dice — Hackney · OPEN 28/5" />
    <meta property="og:description" content="No Dice — 407 Mentmore Terrace, Hackney, E8 3PH. Opening 28/5." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nodice.bar/" />
    <meta name="theme-color" content="#000000" />
    <!-- Installable "Add to Home Screen" app icon → opens the staff sign-in (/today).
         Icons live in public/ (generated from the No Dice cubes mark). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="No Dice" />
    <!-- "black" keeps the installed app's content BELOW the phone status bar
         (clock/wifi/battery) instead of sliding under it — avoids the header
         colliding with the status bar in full-screen app mode. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Default favicon · dice emoji.
         Hackney route swaps this to a palm tree at runtime (HackneyApp.jsx). -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
